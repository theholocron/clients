# Throwaway workflow for trialling Sentinel's actionlint check
# (theholocron/holocron#904). Fixed version: every finding resolved, so
# Sentinel's check should go green and resolve its own review threads.
# DO NOT MERGE.
name: Sentinel Trial

on: # yamllint disable-line rule:truthy
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Loop over text files
        run: |
          for f in ./*.txt; do
            echo "found $f"
          done
      - name: Print home
        run: echo "$HOME"
