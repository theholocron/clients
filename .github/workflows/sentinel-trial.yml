# Throwaway workflow for trialling Sentinel's actionlint check
# (theholocron/holocron#904). Every problem below is deliberate.
# DO NOT MERGE.
name: Sentinel Trial

on: # yamllint disable-line rule:truthy
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Loop over text files
        run: |
          for f in $(ls *.txt); do
            echo "found $f"
          done
      - name: Print home
        run: echo $HOME
